<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="app-version" content="2026-10-14b">
<title>Midt i livet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --desk:#E9E3DA; --paper:#FBF8F3; --ink:#4A3F3A; --muted:#857970; --rule:#D9CEC2; --border:#A89A8E;
  --blush:#F3DDD6; --blush-d:#B5776C;
  --beige:#EFE2D0; --beige-d:#A5825B;
  --taupe:#E2DAD1; --taupe-d:#7B6C60;
  --sage:#CDD6C3; --sage-d:#5C7354;
  --mauve:#E6D4CF; --mauve-d:#976C70;
  --peach:#F6E6D5; --peach-d:#B98356;
  --forest:#4E3B2F; --on-forest:#F6EFE6;
  --shade:#2B1E18;
  --l1:#C07A6E; --l2:#E0B25C; --l3:#4E3B2F;
  --olive:#DFE0CD; --olive-d:#6B6E45; --clay:#EEDDCC; --clay-d:#99694A;
  --serif:"Cormorant Garamond", Georgia, "Times New Roman", serif;
  --sans:"Source Sans 3", "Segoe UI", Helvetica, Arial, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --desk:#1C1917; --paper:#26211E; --ink:#EDE4DA; --muted:#AFA398; --rule:#443B35; --border:#6B5E55;
    --blush:#3A2A28; --blush-d:#E0A597; --beige:#372E24; --beige-d:#D6B28A; --taupe:#312B27; --taupe-d:#BFAFA2;
    --sage:#29302A; --sage-d:#A6BD9C; --mauve:#352A2B; --mauve-d:#D2A5A9; --peach:#3A2F25; --peach-d:#E0AE82;
    --forest:#4A3A30; --on-forest:#F3EADF; --olive:#2E3024; --olive-d:#BFC296; --clay:#382B22; --clay-d:#DDAA88; --l1:#E7A99F; --l2:#E8C27E; --l3:#EDE4DA; --shade:#FFF6EC;
  }
}
:root[data-theme="dark"]{
  --desk:#1C1917; --paper:#26211E; --ink:#EDE4DA; --muted:#AFA398; --rule:#443B35; --border:#6B5E55;
  --blush:#3A2A28; --blush-d:#E0A597; --beige:#372E24; --beige-d:#D6B28A; --taupe:#312B27; --taupe-d:#BFAFA2;
  --sage:#29302A; --sage-d:#A6BD9C; --mauve:#352A2B; --mauve-d:#D2A5A9; --peach:#3A2F25; --peach-d:#E0AE82;
  --forest:#4A3A30; --on-forest:#F3EADF; --olive:#2E3024; --olive-d:#BFC296; --clay:#382B22; --clay-d:#DDAA88; --l1:#E7A99F; --l2:#E8C27E; --l3:#EDE4DA; --shade:#FFF6EC;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;background:var(--desk);color:var(--ink);font-family:var(--sans);font-size:18px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100%}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--beige-d);outline-offset:3px;border-radius:6px}
.wrap{max-width:600px;margin:0 auto;padding:14px 12px 110px}
.page{background:var(--paper);border-radius:22px;padding:18px 18px 28px;box-shadow:0 1px 2px rgba(60,45,35,.08),0 10px 30px rgba(60,45,35,.07)}
header.top{display:flex;align-items:center;justify-content:space-between}
.brand{font-family:var(--serif);font-style:italic;font-weight:600;font-size:22px;color:var(--ink);line-height:1.1}
.logo{width:52px;height:45px;flex:none;color:var(--ink)}
.welcome-logo{width:150px;height:130px;display:block;margin:4px auto 10px;color:var(--ink)}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--beige);border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin-top:14px;font-size:16px}
.banner .btn{min-height:42px;padding:6px 16px;font-size:15px;flex:none}
.steps{display:flex;justify-content:center;gap:8px;margin:14px 0 4px}
.steps i{width:9px;height:9px;border-radius:50%;border:1.3px solid var(--ink)}
.steps i.on{background:var(--ink)}
.modal textarea.plain{width:100%;min-height:120px;border:1px solid var(--border);border-radius:12px;background:var(--paper);padding:10px;font-size:13px;font-family:ui-monospace,Menlo,monospace}
.set-h{font-family:var(--serif);font-size:21px;font-weight:600;margin:20px 0 4px;text-align:center}
.modal .card{max-height:88vh;overflow-y:auto}
.howto{margin:8px 0 0;padding-left:22px;text-align:left}
.howto li{margin:6px 0}
.tagline{font-size:14px;color:var(--muted);margin-top:2px}
.icon-btn{width:46px;height:46px;border-radius:50%;border:1px solid var(--rule);background:var(--paper);display:grid;place-items:center;color:var(--ink)}
.icon-btn svg{width:21px;height:21px}
.title{text-align:center;margin:10px 0 2px}
.title .orn{display:flex;align-items:center;justify-content:center;gap:14px;font-family:var(--serif);font-size:19px;letter-spacing:.28em;text-transform:uppercase;color:var(--ink)}
.title .orn::before,.title .orn::after{content:"";width:34px;height:14px;background:
  radial-gradient(circle at 50% 50%,var(--ink) 1.6px,transparent 2px),
  linear-gradient(var(--ink),var(--ink)) center/100% 1px no-repeat;opacity:.75}
.title h1{font-family:var(--serif);font-weight:600;font-size:44px;line-height:1;letter-spacing:.06em;text-transform:uppercase;margin:4px 0 0}
.title .sub{font-family:var(--serif);font-style:italic;font-size:19px;color:var(--muted);margin:6px 0 0}
.nav{display:flex;align-items:center;justify-content:center;gap:12px;margin:12px 0 4px}
.nav .icon-btn{width:42px;height:42px}
.nav .lbl{font-family:var(--serif);font-size:19px;min-width:0}
.link{background:none;border:none;color:var(--beige-d);font-weight:600;padding:6px 2px;text-decoration:underline;text-underline-offset:4px;font-size:16px}
.grid{display:grid;gap:14px;margin-top:18px}
@media (min-width:430px){.grid.two{grid-template-columns:1fr 1fr}.span{grid-column:1/-1}}
.box{border:1px solid var(--border);border-radius:14px;background:var(--c,var(--taupe));overflow:hidden}
.box > .hd{display:flex;align-items:center;justify-content:center;gap:10px;padding:9px 12px 7px;border-bottom:1px solid var(--border);font-family:var(--serif);font-size:20px;font-weight:600;letter-spacing:.04em}
.box > .hd::before,.box > .hd::after{content:"✦";font-size:11px;opacity:.7}
.box.dark{--c:var(--forest);color:var(--on-forest)}
.box.dark > .hd{border-color:rgba(255,255,255,.25)}
.box > .bd{padding:14px 14px 16px}
.c-blush{--c:var(--blush);--d:var(--blush-d)} .c-beige{--c:var(--beige);--d:var(--beige-d)} .c-taupe{--c:var(--taupe);--d:var(--taupe-d)}
.c-sage{--c:var(--sage);--d:var(--sage-d)} .c-mauve{--c:var(--mauve);--d:var(--mauve-d)} .c-peach{--c:var(--peach);--d:var(--peach-d)}
.c-olive{--c:var(--olive);--d:var(--olive-d)} .c-clay{--c:var(--clay);--d:var(--clay-d)}
.c-paper{--c:var(--paper);--d:var(--taupe-d)}
.q{font-size:17px;margin:0 0 10px;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.q + .q, .bd .sp{margin-top:18px}
.q .val{font-family:var(--serif);font-style:italic;font-size:19px;color:var(--d)}
.dots{display:flex;gap:10px}
.dot{width:46px;height:46px;border-radius:50%;border:1.5px solid var(--d);background:var(--paper);transition:background .15s}
.dot.fill{background:var(--d)}
.ends{display:flex;justify-content:space-between;width:270px;max-width:100%;font-size:14px;color:var(--muted);margin-top:4px}
.radios{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px}
.opt{display:flex;align-items:center;gap:10px;background:none;border:none;padding:8px 2px;text-align:left;font-size:17px;min-height:44px}
.opt .r{flex:none;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--d);background:var(--paper);display:grid;place-items:center}
.opt.on .r::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--d)}
.radios.cols > div{display:flex;flex-direction:column}
.colh{font-family:var(--serif);font-style:italic;font-size:18px;color:var(--d);margin:0 0 2px;padding-bottom:4px;border-bottom:1px solid var(--border)}
.opt .s{flex:none;width:24px;height:24px;border-radius:5px;border:1.5px solid var(--d);background:var(--paper);display:grid;place-items:center}
.opt.on .s{background:var(--d)}
.opt.on .s::after{content:"";width:10px;height:6px;border-left:2.5px solid var(--paper);border-bottom:2.5px solid var(--paper);transform:rotate(-45deg) translate(1px,-1px)}
.lined{display:block;width:100%;border:none;background:transparent;resize:vertical;padding:0 4px;font-size:18px;line-height:34px;min-height:136px;
  background-image:repeating-linear-gradient(to bottom,transparent 0 33px,var(--border) 33px 34px);background-attachment:local;opacity:1}
.lined:focus{outline:none;background-color:rgba(255,255,255,.35)}
.box.dark .lined{background-image:repeating-linear-gradient(to bottom,transparent 0 33px,rgba(255,255,255,.28) 33px 34px);color:var(--on-forest)}
.lined.short{min-height:102px}
input[type=text],input[type=date]{width:100%;border:none;border-bottom:1px solid var(--border);background:transparent;padding:8px 4px;font-size:18px}
input:focus{outline:none;border-bottom-color:var(--ink)}
.hint{font-size:15px;color:var(--muted);margin:8px 0 0}
.foot{text-align:center;font-family:var(--serif);font-style:italic;font-size:18px;color:var(--muted);margin:22px 8px 0}
/* tracker */
.tracker{display:grid;grid-template-columns:minmax(92px,1.3fr) repeat(7,1fr);gap:7px 4px;align-items:center}
.tracker .h{text-align:center;font-size:13px;color:var(--muted);font-weight:600}
.tracker .rl{font-size:15px}
.tracker .cell{justify-self:center;width:28px;height:28px;border-radius:50%;border:1.3px solid var(--d);background:var(--paper);padding:0}
.tracker .cell.f{background:var(--d)}
.facts{list-style:none;padding:0;margin:0}
.facts li{display:flex;justify-content:space-between;gap:12px;padding:8px 2px;border-bottom:1px solid var(--border)}
.facts li:last-child{border-bottom:none}
.facts li span:last-child{font-weight:600;text-align:right}
.seg{display:flex;justify-content:center;gap:6px;margin-top:14px;flex-wrap:wrap}
.seg button{border:1px solid var(--border);background:var(--paper);border-radius:999px;padding:7px 16px;min-height:42px;font-size:16px}
.seg button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chart{width:100%;height:auto;display:block}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:15px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px;margin-right:6px}
.heat{display:grid;gap:5px 3px;align-items:center}
.heat .c{justify-self:center;width:min(22px,100%);aspect-ratio:1;border-radius:50%;border:1.2px solid var(--d)}
.heat .lb{font-size:13px;color:var(--muted)}
.bars{list-style:none;padding:0;margin:0}
.bars li{margin:0 0 12px}.bars li:last-child{margin:0}
.bar{height:10px;border-radius:5px;background:var(--paper);border:1px solid var(--border);margin-top:5px;overflow:hidden}
.bar b{display:block;height:100%;background:var(--d)}
.insight{margin:0 0 12px;font-size:17px}.insight:last-child{margin:0}
.rampkey{display:flex;align-items:center;gap:6px;margin-top:12px;font-size:14px;color:var(--muted)}
.rampkey i{width:18px;height:18px;border-radius:50%;border:1.2px solid var(--d)}
.rampkey span:first-child{margin-right:4px}.rampkey span:last-child{margin-left:4px}
.insight::before{content:"✦ ";color:var(--d)}
.box.dark .insight::before{color:#D9B784}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:10px 22px;border-radius:999px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);font-weight:600;font-size:17px}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.danger{background:#8B3A2E;border-color:#8B3A2E;color:#fff}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;justify-content:center}
.list{list-style:none;padding:0;margin:0}
.list li{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border);min-height:46px}
.list li .t{flex:1;padding:6px 0}
.list li.done .t{text-decoration:line-through;color:var(--muted)}
.x{background:none;border:none;color:var(--muted);font-size:24px;width:40px;height:40px;line-height:1}
.addrow{display:flex;gap:8px;margin-top:10px;align-items:flex-end}
.addrow input{flex:1}
.addrow .btn{min-height:42px;padding:6px 18px;font-size:16px}
.from-weeks{list-style:none;padding:0;margin:0}
.from-weeks li{padding:8px 0;border-bottom:1px solid rgba(255,255,255,.25);font-size:17px}
.from-weeks li:last-child{border-bottom:none}
.joys li{border-bottom-color:var(--border)}
.from-weeks small{display:block;opacity:.75;font-size:14px}
.empty{text-align:center}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
nav.tabs .in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{border:none;background:none;padding:9px 2px 11px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13.5px;color:var(--muted);min-height:62px}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:var(--ink);font-weight:600}
nav.tabs button.on svg{stroke:var(--blush-d)}
.upd{position:fixed;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top,0px));max-width:576px;margin:0 auto;display:none;align-items:center;justify-content:space-between;gap:12px;background:var(--forest);color:var(--on-forest);border-radius:16px;padding:12px 14px 12px 18px;font-size:16px;z-index:40;box-shadow:0 8px 24px rgba(40,30,25,.25)}
.upd.show{display:flex}
.upd button{flex:none;border:none;border-radius:999px;background:#D9B784;color:#2B1E18;font-weight:600;padding:10px 18px;min-height:44px;font-size:15px}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);background:var(--ink);color:var(--paper);padding:9px 18px;border-radius:999px;font-size:15px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:20}
.toast.show{opacity:1;transform:translate(-50%,0)}
.modal{position:fixed;inset:0;background:rgba(40,30,25,.4);display:none;align-items:flex-end;justify-content:center;z-index:30;padding:0 12px calc(12px + env(safe-area-inset-bottom,0px))}
.modal.open{display:flex}
.modal .card{background:var(--paper);border-radius:22px;padding:24px 20px;max-width:540px;width:100%}
.modal h3{font-family:var(--serif);font-size:28px;font-weight:600;margin:0 0 6px;text-align:center}
.modal p{text-align:center}
.weekdots{display:flex;justify-content:center;gap:6px;margin:6px 0 2px}
.wd{background:none;border:none;padding:4px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:13px;color:var(--muted);min-width:36px}
.wd i{width:18px;height:18px;border-radius:50%;border:1.4px solid var(--blush-d);background:var(--paper)}
.wd.half i{background:linear-gradient(to top,var(--blush-d) 50%,var(--paper) 50%)}
.wd.full i{background:var(--blush-d)}
.wd.cur span{color:var(--ink);font-weight:600}
.wd:disabled{opacity:.35}
.seg.part{margin-top:10px}
.dayline{text-align:center;font-family:var(--serif);font-style:italic;font-size:21px;line-height:1.35;margin:16px 10px 0}
.welcome-back{text-align:center;font-family:var(--serif);font-style:italic;font-size:19px;color:var(--muted);margin:12px 0 0}
.banner.catch{flex-direction:column;align-items:stretch;text-align:center}
.banner.catch .bt{display:flex;gap:14px;justify-content:center;align-items:center}
.sleepsum{text-align:center;font-size:16px;color:var(--muted);margin:0}
.looktext{text-align:center;font-family:var(--serif);font-size:24px;font-style:italic;margin:2px 0 0;line-height:1.3}
.seg.res{margin-top:4px}.seg.res button{min-width:76px}
.loopline{text-align:center;font-size:17px;margin:14px 0 0}
.closeline{text-align:center;font-family:var(--serif);font-style:italic;font-size:22px;margin:0 0 10px}
.btn.big{min-width:220px;font-size:18px}
.btn.ghost.light{color:var(--on-forest);border-color:rgba(255,255,255,.5)}
.from-weeks em{opacity:.75}
.print-only{display:none}
.ptext{white-space:pre-wrap;font-size:16px;line-height:1.5;min-height:3em;border-bottom:1px solid var(--border);padding:2px 4px 6px}
.meds li{align-items:flex-start}
.medbody{flex:1;background:none;border:none;text-align:left;padding:8px 0;display:flex;flex-direction:column;gap:1px}
.medbody .mt{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--d)}
.medbody .mn{font-size:18px;font-weight:600}
.medbody .md{font-size:15px;color:var(--muted)}
.med.ended .mn{color:var(--muted);font-weight:500}
.medform{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.medform .seg{margin-top:0;margin-bottom:4px}
.medform .seg button{font-size:15px;padding:6px 12px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
@media print{
  /* utskrift alltid i lyse farger, også når telefonen står i mørk modus */
  :root:not(#utskrift){
    --desk:#E9E3DA; --paper:#FBF8F3; --ink:#4A3F3A; --muted:#857970; --rule:#D9CEC2; --border:#A89A8E;
    --blush:#F3DDD6; --blush-d:#B5776C; --beige:#EFE2D0; --beige-d:#A5825B; --taupe:#E2DAD1; --taupe-d:#7B6C60;
    --sage:#CDD6C3; --sage-d:#5C7354; --mauve:#E6D4CF; --mauve-d:#976C70; --peach:#F6E6D5; --peach-d:#B98356;
    --forest:#4E3B2F; --on-forest:#F6EFE6; --shade:#2B1E18; --l1:#C07A6E; --l2:#E0B25C; --l3:#4E3B2F;
    --olive:#DFE0CD; --olive-d:#6B6E45; --clay:#EEDDCC; --clay-d:#99694A;
    color-scheme:light;
  }
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body{background:#fff;color:var(--ink)}
  textarea,input{color:var(--ink)!important;background-color:transparent!important}
  nav.tabs,header.top,.no-print,.toast,.upd,.modal{display:none!important}
  .print-only{display:block!important}
  .lined{background-image:none!important}
  .title .orn::before,.title .orn::after{background:var(--ink)!important;height:1px!important;opacity:.6}
  .box,.box > .bd,.box > .hd{background-color:var(--c,var(--taupe))!important}
  .box{break-inside:avoid}
  .medbody{padding:4px 0}
  .wrap{padding:0;max-width:none}.page{box-shadow:none}
}
</style>
</head>
<body>

<script>
(function(){
const KEY="minovergang.v1";
const blank=()=>({meta:{},days:{},weeks:{},months:{},hobbies:[],work:"",doctor:{impact:"",since:"",questions:[],said:"",tryout:"",next:"",meds:"",items:[]}});
let S;
try{S=JSON.parse(localStorage.getItem(KEY))||blank();}catch(e){S=blank();}
S=Object.assign(blank(),S);S.meta=S.meta||{};S.doctor=Object.assign(blank().doctor,S.doctor||{});if(!Array.isArray(S.doctor.items))S.doctor.items=[];
let saveT,toastT;
function save(quiet){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){} if(!quiet)toast("Lagret");}
function saveSoon(){clearTimeout(saveT);saveT=setTimeout(()=>save(),600);}
function toast(t){const el=document.getElementById("toast");el.textContent=t;el.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove("show"),1300);}

const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse=s=>{const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c);};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
const monday=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x;};
function weekNo(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const n=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-n);const y=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y)/864e5+1)/7);}
const today=()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate());};
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const fmtLong=d=>cap(d.toLocaleDateString("nb-NO",{weekday:"long",day:"numeric",month:"long"}));
const fmtShort=d=>d.toLocaleDateString("nb-NO",{day:"numeric",month:"short"}).replace(".","");
const monthKey=d=>d.getFullYear()+"-"+pad(d.getMonth()+1);
const fmtMonth=d=>cap(d.toLocaleDateString("nb-NO",{month:"long",year:"numeric"}));
const num=(n,d=1)=>n==null||isNaN(n)?"–":n.toFixed(d).replace(".",",");
const esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const DN=["M","T","O","T","F","L","S"], DN2=["Ma","Ti","On","To","Fr","Lø","Sø"];

const SCALES={
  sleep:{q:"Hvordan sov du i natt?",l:["Svært dårlig","Dårlig","Greit","Godt","Svært godt"]},
  mood:{q:"Hvordan er humøret?",l:["Tungt","Lavt","Nøytralt","Godt","Lyst"]},
  energy:{q:"Hvor mye energi har du hatt?",l:["Helt tom","Lite","Middels","God","Full"]},
  work:{q:"Energien på jobb",l:["Helt tom","Lite","Middels","God","Full"]}
};
const FLASH=["Ingen","1–2","3–5","6 eller flere"], FLASHN=[0,1.5,4,7];
const BLEED=["Ingen","Småblødning","Vanlig","Kraftig"];
const HOURS=["Under 5 timer","5–6 timer","6–7 timer","7–8 timer","Over 8 timer"], HOURSN=[4.5,5.5,6.5,7.5,8.5];
const ONSET=["Under 15 min","15–30 min","Over 30 min"];
const WAKE=["Ingen","1–2 ganger","3 eller flere"];
const MOVEMIN=["Ingen","Under 30 min","30–60 min","Over 60 min"];
const MOVE_A=["Gå tur","Gå eller sykle til jobb","Ærend og shopping","Hage eller husarbeid","Jogging","Sykkeltur"], MOVE_B=["Styrke med vekter","Pilates og egenvekt","Yoga eller tøying","Svømming","Dans","Annet"];
const FOOD=["Faste måltider","Drakk nok vann","Frukt og grønt","Protein i måltidene","Snacks","Mye sukker","Kaffe etter kl. 14","Alkohol","Sterk mat","Spiste ute eller takeaway"];
const SYMPT_A=["Nattesvette","Hodepine","Ledd og muskler","Mageplager","Tørr hud","Tørre øyne","Tørre slimhinner"], SYMPT_B=["Svimmelhet","Hjertebank","Hjernetåke","Glemsomhet","Uro","Nedstemthet","Irritabilitet"];

const MTYPES=["Medisin","Sykdom eller tilstand","Annet"];
const U={medType:0,view:"today",day:today(),week:monday(today()),month:new Date(today().getFullYear(),today().getMonth(),1),range:8,heat:"sleep"};

const ICONS={
 today:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>',
 week:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="5" cy="8" r="1.8"/><circle cx="12" cy="8" r="1.8"/><circle cx="19" cy="8" r="1.8"/><circle cx="5" cy="16" r="1.8"/><circle cx="12" cy="16" r="1.8"/><circle cx="19" cy="16" r="1.8"/></svg>',
 life:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M12 21c-5-3.5-8-6.5-8-10a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 11c0 3.5-3 6.5-8 10z"/></svg>',
 overview:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 19h16"/><path d="M4 15l5-5 4 3 7-7"/></svg>',
 doctor:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="5" y="3.5" width="14" height="17" rx="2.5"/><path d="M9 3.5h6v3H9zM9 11h6M9 15h4"/></svg>'
};
const TABS=[["today","I dag"],["week","Uka"],["life","Livet"],["overview","Oversikt"],["doctor","Legetimen"]];
const chev=dir=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="${dir<0?"M15 5l-7 7 7 7":"M9 5l7 7-7 7"}"/></svg>`;
const box=(c,t,inner,cls="")=>`<section class="box c-${c} ${cls}">${t?`<div class="hd">${t}</div>`:""}<div class="bd">${inner}</div></section>`;
const title=(small,big,sub)=>`<div class="title">${small?`<div class="orn">${small}</div>`:""}<h1>${big}</h1>${sub?`<p class="sub">${sub}</p>`:""}</div>`;

function renderTabs(){document.getElementById("tabs").innerHTML=TABS.map(([k,l])=>`<button data-act="tab" data-v="${k}" class="${U.view===k?"on":""}" ${U.view===k?'aria-current="page"':""}>${ICONS[k]}<span>${l}</span></button>`).join("");}
function render(){renderTabs();document.getElementById("view").innerHTML=({today:vToday,week:vWeek,life:vLife,overview:vOverview,doctor:vDoctor})[U.view]();if(U.view==="overview")drawAfter();}

/* I DAG */
function dayData(k){return S.days[k]||(S.days[k]={});}
function scale(f,val){const s=SCALES[f];
  return `<p class="q"><span>${s.q}</span><span class="val">${val?s.l[val-1]:""}</span></p>
  <div class="dots" role="group" aria-label="${s.q}">${[1,2,3,4,5].map(i=>`<button class="dot ${val&&i<=val?"fill":""}" style="${val&&i<=val?`background:${ramp(i)}`:""}" data-act="rate" data-f="${f}" data-v="${i}" aria-pressed="${val===i}" aria-label="${s.l[i-1]}"></button>`).join("")}</div>
  <div class="ends"><span>${s.l[0]}</span><span>${s.l[4]}</span></div>`;}
const nextNight=x=>({dt:addDays(x.dt,1),d:S.days[iso(addDays(x.dt,1))]});
const RAMP=["color-mix(in srgb,var(--d) 22%,var(--paper))","color-mix(in srgb,var(--d) 52%,var(--paper))","var(--d)","color-mix(in srgb,var(--d) 70%,var(--shade))","color-mix(in srgb,var(--d) 42%,var(--shade))"];
const ramp=i=>RAMP[Math.max(1,Math.min(5,i))-1];
const rampFor=(v,max)=>ramp(max<=1?5:Math.round(1+4*(v-1)/(max-1)));
const checks=(f,labels,arr)=>`<div class="radios">${labels.map(s=>{const on=(arr||[]).includes(s);return `<button class="opt ${on?"on":""}" data-act="multi" data-f="${f}" data-v="${s}" aria-pressed="${on}"><span class="s"></span>${s}</button>`;}).join("")}</div>`;
const optBtn=(f,s,arr)=>{const on=(arr||[]).includes(s);return `<button class="opt ${on?"on":""}" data-act="multi" data-f="${f}" data-v="${s}" aria-pressed="${on}"><span class="s"></span>${s}</button>`;};
const checkCols=(f,cols,arr)=>`<div class="radios cols">${cols.map(([h,l])=>`<div>${h?`<p class="colh">${h}</p>`:""}${l.map(s=>optBtn(f,s,arr)).join("")}</div>`).join("")}</div>`;
const radios=(f,labels,val)=>`<div class="radios">${labels.map((l,i)=>`<button class="opt ${val===i?"on":""}" data-act="pick" data-f="${f}" data-v="${i}" aria-pressed="${val===i}"><span class="r"></span>${l}</button>`).join("")}</div>`;
/* morgen og kveld: tekster i Elisabeths stemme, samme linje hele dagen */
const AM_LINES=["God morgen. To små spørsmål, så er du i gang.","Ingen dag trenger å bli perfekt. Den trenger bare å bli din.","Start med det du gleder deg til. Resten finner sin plass.","En kopp kaffe og et par trykk. Så kan dagen begynne.","Du bestemmer tempoet i dag."];
const PM_LINES=["Dagen er nesten over. Vær ærlig, og vær snill mot deg selv.","Et par minutter for deg, før dagen lukkes.","Det du merker deg i kveld, ser du sammenhengen i senere.","Ikke alt trenger en karakter. Noe trenger bare å bli sett."];
const CLOSE_LINES=["Dagen er tatt vare på. Sov godt.","Lukket og lagret. Resten kan vente til i morgen.","Fint at du stoppet opp. Det er ikke alle som gjør det.","Dagen var din. Det er den fortsatt."];
const RES=["Ja","Delvis","Nei"];
const RES_LINES={1:["Godt. Det er sånne ting en uke husker.","Fint. Det er verdt å legge merke til.","Akkurat sånn. Ta med deg den."],2:["Litt er også noe. Det teller.","Halvveis er fortsatt et sted å være."],3:["Noen dager tar en annen vei. Det du gledet deg til, er ikke borte.","Det ble ikke i dag. Det sier noe om dagen, ikke om deg.","Planer flytter seg. Det gjør du også."]};
const daySeed=k=>k.split("-").reduce((a,b)=>a*31+ +b,7);
const lineFor=(arr,k,salt)=>arr[(daySeed(k)+(salt||0))%arr.length];
const filled=x=>!!(x&&Object.keys(x).some(f=>{const v=x[f];return v!==undefined&&v!==""&&!(Array.isArray(v)&&!v.length);}));
const hasSleep=x=>!!(x&&(x.sleep||typeof x.sleepH==="number"||typeof x.onset==="number"||typeof x.wake==="number"));
function lookFor(k){const d=S.days[k]||{},p=S.days[iso(addDays(parse(k),-1))]||{};return d.look!==undefined?d.look:(p.next||"");}
function lookFromYesterday(k){const d=S.days[k]||{},p=S.days[iso(addDays(parse(k),-1))]||{};return d.look===undefined&&!!p.next;}
function carryFor(k){const d=S.days[k]||{},p=S.days[iso(addDays(parse(k),-1))]||{};return (d.look===undefined||d.look===p.next)?(p.nextCarry||0):0;}
function autoPart(k){const d=S.days[k]||{};return k===iso(today())&&new Date().getHours()<12&&!d.closed?"am":"pm";}

function weekDots(){
  const m=monday(U.day),k=iso(U.day);let h="";
  for(let i=0;i<7;i++){const dt=addDays(m,i),dk=iso(dt),x=S.days[dk],fut=dt>today();
    const st=x&&x.closed?"full":filled(x)?"half":"";
    h+=`<button class="wd ${st} ${dk===k?"cur":""}" data-act="goday" data-v="${dk}" ${fut?"disabled":""} aria-label="${fmtShort(dt)}${st==="full"?", lukket":st==="half"?", påbegynt":""}"><i></i><span>${DN2[i]}</span></button>`;}
  return `<div class="weekdots no-print">${h}</div>`;
}

function catchUp(){
  /* bare på dagens side, bare før hun har begynt på i dag */
  const k=iso(today());if(iso(U.day)!==k||filled(S.days[k]))return "";
  const yk=iso(addDays(today(),-1)),y=S.days[yk];
  let last=null;for(let i=1;i<=120;i++){if(filled(S.days[iso(addDays(today(),-i))])){last=i;break;}}
  if(last===null)return "";
  if(S.meta.skipCatch===yk)return "";
  if(last===1&&!y.closed)return `<div class="banner catch no-print"><span>I går ble ikke lukket. Vil du lukke den nå?</span><div class="bt"><button class="btn" data-act="catchup">Lukk i går</button><button class="link" data-act="skipcatch">La den være</button></div></div>`;
  if(last===2)return `<div class="banner catch no-print"><span>I går ble ikke fylt ut. Ta den på et minutt, eller la den være.</span><div class="bt"><button class="btn" data-act="catchup">Ta i går</button><button class="link" data-act="skipcatch">La den være</button></div></div>`;
  if(last>2)return `<p class="welcome-back">Velkommen tilbake. Vi begynner med i dag.</p>`;
  return "";
}

function sleepBox(d,label){
  return box("blush",label||"Søvn",scale("sleep",d.sleep)+`<p class="q" style="margin-top:18px"><span>Hvor mange timer sov du?</span></p>${radios("sleepH",HOURS,d.sleepH)}<p class="q" style="margin-top:16px"><span>Hvor lang tid tok det å sovne?</span></p>${radios("onset",ONSET,d.onset)}<p class="q" style="margin-top:16px"><span>Hvor mange ganger våknet du?</span></p>${radios("wake",WAKE,d.wake)}`);
}

function loopBox(k,d){
  const look=lookFor(k);if(!look)return "";
  const r=d.lookRes,carry=carryFor(k);
  const btns=`<div class="seg res" role="group" aria-label="Ble det noe av?">${RES.map((l,i)=>`<button class="${r===i+1?"on":""}" data-act="lookres" data-v="${i+1}" aria-pressed="${r===i+1}">${l}</button>`).join("")}</div>`;
  let after="";
  if(r)after=`<p class="loopline">${lineFor(RES_LINES[r],k)}</p>`;
  if(r===3){
    if(d.lookLet)after+=`<p class="hint" style="text-align:center">Sluppet. Det er også et valg.</p>`;
    else if(d.next===look&&d.nextCarry)after+=`<p class="hint" style="text-align:center">Står på lista for i morgen.</p>`;
    else if(carry>=2)after+=`<p class="loopline" style="margin-top:12px">Dette har ventet en stund. Er det fortsatt viktig, eller kan du slippe det?</p><div class="row"><button class="btn" data-act="carry">Fortsatt viktig</button><button class="btn ghost" data-act="letgo">Slipp det</button></div>`;
    else after+=`<div class="row"><button class="btn" data-act="carry">Ta det med til i morgen</button><button class="btn ghost" data-act="letgo">La det gå</button></div>`;
  }
  return box("beige","Det du gledet deg til",`<p class="looktext">${esc(look)}</p><p class="q" style="justify-content:center;margin-top:12px"><span>Ble det noe av?</span></p>${btns}${after}`);
}

function closedBox(k,d){
  const look=lookFor(k),rows=[];
  if(look&&d.lookRes)rows.push(["Gledet deg til",esc(look)+` <em>(${RES[d.lookRes-1].toLowerCase()})</em>`]);
  if(d.best)rows.push(["Det beste",esc(d.best)]);
  if(d.next)rows.push(["I morgen",esc(d.next)]);
  return box("","Dagen er lukket",`<p class="closeline">${lineFor(CLOSE_LINES,k)}</p>${rows.length?`<ul class="from-weeks">${rows.map(([a,b])=>`<li><small>${a}</small>${b}</li>`).join("")}</ul>`:""}<div class="row"><button class="btn ghost light" data-act="reopen">Åpne dagen igjen</button></div>`,"dark");
}

function vToday(){
  const k=iso(U.day), d=S.days[k]||{}, isToday=k===iso(today());
  const part=U.part||autoPart(k);
  let last7=0;for(let i=0;i<7;i++){if(filled(S.days[iso(addDays(today(),-i))]))last7++;}
  const work=d.noWork?"":scale("work",d.work);
  const nDays=Object.keys(S.days).filter(k=>filled(S.days[k])).length;

function insights(all){
  const out=[];const pair=(A,B,f)=>A.length>=3&&B.length>=3?[avg(A,f),avg(B,f)]:null;
  let p=pair(all.filter(x=>x.d&&x.d.flash>=2&&x.d.sleep),all.filter(x=>x.d&&typeof x.d.flash==="number"&&x.d.flash<2&&x.d.sleep),"sleep");
  if(p&&Math.abs(p[0]-p[1])>=.4)out.push(`På dager med tre eller flere hetetokter var søvnen i snitt <b>${num(p[0])}</b>. Andre dager <b>${num(p[1])}</b>.`);
  p=pair(all.filter(x=>x.d&&x.d.sleep>=4&&x.d.work),all.filter(x=>x.d&&x.d.sleep&&x.d.sleep<=2&&x.d.work),"work");
  if(p&&Math.abs(p[0]-p[1])>=.4)out.push(`Etter gode netter var energien på jobb <b>${num(p[0])}</b>. Etter dårlige netter <b>${num(p[1])}</b>.`);
  p=pair(all.filter(x=>x.d&&x.d.sleep>=4&&x.d.mood),all.filter(x=>x.d&&x.d.sleep&&x.d.sleep<=2&&x.d.mood),"mood");
  if(p&&Math.abs(p[0]-p[1])>=.4)out.push(`Humøret fulgte søvnen: <b>${num(p[0])}</b> etter gode netter, <b>${num(p[1])}</b> etter dårlige.`);
  {const A=all.filter(x=>x.d&&x.d.flash>=2&&typeof x.d.wake==="number"),B=all.filter(x=>x.d&&typeof x.d.flash==="number"&&x.d.flash<2&&typeof x.d.wake==="number");
   if(A.length>=3&&B.length>=3){const a=Math.round(A.filter(x=>x.d.wake===2).length/A.length*100),b=Math.round(B.filter(x=>x.d.wake===2).length/B.length*100);
   if(Math.abs(a-b)>=15)out.push(`Etter dager med tre eller flere hetetokter våknet du tre ganger eller mer <b>${a} %</b> av nettene. Ellers <b>${b} %</b>.`);}}
  const has=(x,s)=>x.d&&(x.d.food||[]).includes(s);
  const logged=all.filter(x=>x.d&&(x.d.food||[]).length).map(x=>({a:has(x,"Alkohol"),n:nextNight(x)})).filter(y=>y.n.d&&y.n.d.sleep);
  p=pair(logged.filter(y=>y.a).map(y=>y.n),logged.filter(y=>!y.a).map(y=>y.n),"sleep");
  if(p&&Math.abs(p[0]-p[1])>=.4)out.push(`Natten etter dager med alkohol var søvnen <b>${num(p[0])}</b>. Ellers <b>${num(p[1])}</b>.`);
  p=pair(all.filter(x=>x.d&&x.d.move>=1&&x.d.energy),all.filter(x=>x.d&&x.d.move===0&&x.d.energy),"energy");
  if(p&&Math.abs(p[0]-p[1])>=.4)out.push(`På dager du beveget deg, var energien <b>${num(p[0])}</b>. På dager uten <b>${num(p[1])}</b>.`);
  return out.map(t=>`<p class="insight c-sage">${t}</p>`).join("");
}

    const alc=(wd>=4&&r()<.45)||r()<.08,move=r()<.25?0:cl(1+r()*2.4,1,3);const flash=cl(1.9-t*1.6+(alc?.8:0)+(r()-.5)*2.2,0,3),sleep=cl(4.1-flash*.6-(prevAlc?.9:0)+(r()-.5)*1.4,1,5),mood=cl(sleep*.55+1.4+(r()-.5)*1.3,1,5),energy=cl(sleep*.55+.9+move*.35+(r()-.5)*1.2,1,5);

    const food=[];if(r()<.75)food.push("Faste måltider");if(r()<.6)food.push("Drakk nok vann");if(r()<.6)food.push("Frukt og grønt");if(r()<.5)food.push("Protein i måltidene");if(r()<.25)food.push("Kaffe etter kl. 14");if(alc)food.push("Alkohol");if(r()<.3)food.push("Snacks");if(r()<.12||(wd>=4&&r()<.2))food.push("Spiste ute eller takeaway");if(r()<.1)food.push("Mye sukker");d.food=food;if(wd>4)d.noWork=true;else d.work=cl(energy-.2+(r()-.5),1,5);
    const sym=[];if(flash>=2&&r()<.7)sym.push("Nattesvette");if(sleep<=2&&r()<.6)sym.push("Hjernetåke");if(r()<.18)sym.push("Hodepine");if(r()<.25)sym.push("Ledd og muskler");if(mood<=2&&r()<.5)sym.push("Uro");if(r()<.08)sym.push("Hjertebank");
    if(sym.length)d.sym=sym;const cyc=(83-i)%38;d.bleed=cyc<4?(cyc===1?2:1):0;
    if(r()<.1)d.note=["Lang dag med møter","Gikk tur i lunsjen, hjalp","Våknet tre ganger","Vin til middag","God kveld med venninner"][Math.floor(r()*5)];
    if(r()<.55){d.look=["Lunsj med en venninne","Kveldstur","Ny bok","Middag med barna","Yogatimen","Kaffe i sola","Telefon med søsteren min"][Math.floor(r()*7)];d.lookRes=r()<.6?1:r()<.5?2:3;}
    if(r()<.3)d.best=["Latter i lunsjen","Sola på vei hjem","Ferdig med presentasjonen","God samtale med datteren min"][Math.floor(r()*4)];

    nd.days[iso(dt)]=d;prevAlc=alc;}
  const m0=monday(today());
  nd.weeks[iso(addDays(m0,-7))]={hard:"Nettene. Våknet varm nesten hver natt.",better:"Kjøligere soverom og tur i lunsjen.",workimpact:"Tungt å konsentrere meg i ettermiddagsmøtene.",workease:"Færre møter etter klokka 14",joy:"Middag med søsteren min. Første morgenbad.",next:"Legge meg før 23 fire dager"};

document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b||b.disabled)return;const a=b.dataset.act,v=b.dataset.v;
  const top=()=>window.scrollTo&&window.scrollTo(0,0);
  if(a==="tab"){U.view=v;U.part=null;render();try{top();}catch(x){}return;}
  if(a==="rate"||a==="pick"){const d=dayData(iso(U.day)),f=b.dataset.f,n=+v;d[f]=d[f]===n?undefined:n;save();render();return;}
  if(a==="multi"){const d=dayData(iso(U.day)),f=b.dataset.f;d[f]=d[f]||[];const i=d[f].indexOf(v);i>=0?d[f].splice(i,1):d[f].push(v);save();render();return;}
  if(a==="part"){U.part=v;render();try{top();}catch(x){}return;}
  if(a==="amdone"){save(true);toast("Lagret. Vi ses i kveld.");return;}
  if(a==="lookres"){const k=iso(U.day),d=dayData(k),n=+v;d.lookRes=d.lookRes===n?undefined:n;
    if(d.lookRes!==3){delete d.lookLet;if(d.nextCarry&&d.next===lookFor(k)){delete d.next;delete d.nextCarry;}}save();render();return;}
  if(a==="carry"){const k=iso(U.day),d=dayData(k);d.next=lookFor(k);d.nextCarry=carryFor(k)+1;delete d.lookLet;save();render();return;}
  if(a==="letgo"){const k=iso(U.day),d=dayData(k);d.lookLet=true;if(d.nextCarry&&d.next===lookFor(k)){delete d.next;delete d.nextCarry;}save();render();return;}
  if(a==="closeday"){const d=dayData(iso(U.day));d.closed=true;save(true);render();toast("Dagen er lukket");setTimeout(()=>{const el=document.querySelector(".box.dark");if(el&&el.scrollIntoView)el.scrollIntoView({behavior:"smooth",block:"center"});},60);return;}
  if(a==="reopen"){const d=dayData(iso(U.day));delete d.closed;save();render();return;}
  if(a==="catchup"){U.day=addDays(today(),-1);U.part="pm";render();try{top();}catch(x){}return;}
  if(a==="skipcatch"){S.meta.skipCatch=iso(addDays(today(),-1));save(true);render();return;}
  if(a==="remind"){remind();return;}
  if(a==="mtype"){U.medType=+v;render();return;}
  if(a==="madd"){const n=document.getElementById("mName");if(!n.value.trim()){toast("Skriv navnet først");n.focus();return;}
    S.doctor.items=S.doctor.items||[];S.doctor.items.push({type:U.medType,name:n.value.trim(),detail:document.getElementById("mDetail").value.trim(),since:document.getElementById("mSince").value.trim()});save();render();return;}
  if(a==="mdel"){const it=S.doctor.items[+v];openModal(`<h3>Fjerne?</h3><p class="hint">${esc(it.name)} fjernes fra listen.</p><div class="row"><button class="btn danger" data-act="mdelok" data-v="${v}">Fjern</button><button class="btn ghost" data-act="close">Avbryt</button></div>`);return;}
  if(a==="mdelok"){S.doctor.items.splice(+v,1);save();closeModal();render();return;}
  if(a==="medit"){medEdit(+v);return;}
  if(a==="msave"){const it=S.doctor.items[+v],n=document.getElementById("eName").value.trim();if(!n){toast("Navnet kan ikke være tomt");return;}
    Object.assign(it,{name:n,detail:document.getElementById("eDetail").value.trim(),since:document.getElementById("eSince").value.trim(),type:+document.querySelector("#eType button.on").dataset.v,ended:document.getElementById("eEnded").classList.contains("on")});save();closeModal();render();return;}
  if(a==="etype"){document.querySelectorAll("#eType button").forEach(x=>x.classList.toggle("on",x===b));return;}
  if(a==="eended"){b.classList.toggle("on");b.setAttribute("aria-pressed",b.classList.contains("on"));return;}
  if(a==="nowork"){const d=dayData(iso(U.day));d.noWork=!d.noWork;if(d.noWork)delete d.work;save();render();return;}
  if(a==="day"){const n=addDays(U.day,+v);if(n<=today()){U.day=n;U.part=null;render();}return;}
  if(a==="gotoday"){U.day=today();U.part=null;render();return;}
  if(a==="goday"){const n=parse(v);if(n<=today()){U.day=n;U.part=null;U.view="today";render();try{top();}catch(x){}}return;}
  if(a==="week"){U.week=addDays(U.week,7*+v);render();return;}
  if(a==="thisweek"){U.week=monday(today());render();return;}
  if(a==="month"){U.month=new Date(U.month.getFullYear(),U.month.getMonth()+ +v,1);render();return;}
  if(a==="thismonth"){U.month=new Date(today().getFullYear(),today().getMonth(),1);render();return;}
  if(a==="range"){U.range=+v;render();return;}
  if(a==="heat"){U.heat=v;render();return;}
  if(a==="hobadd"){const i=document.getElementById("hobIn");if(i.value.trim()){S.hobbies.push({t:i.value.trim()});save();render();}return;}
  if(a==="hobdone"){S.hobbies[+v].done=!S.hobbies[+v].done;save();render();return;}
  if(a==="hobdel"){S.hobbies.splice(+v,1);save();render();return;}
  if(a==="qadd"){const i=document.getElementById("qIn");if(i.value.trim()){S.doctor.questions.push(i.value.trim());save();render();}return;}
  if(a==="qdel"){S.doctor.questions.splice(+v,1);save();render();return;}
  if(a==="print"){try{window.print();}catch(x){toast("Utskrift er ikke tilgjengelig her");}return;}
  if(a==="settings"){settings();return;}
  if(a==="close"){closeModal();return;}
  if(a==="theme"){if(v==="auto")document.documentElement.removeAttribute("data-theme");else document.documentElement.setAttribute("data-theme",v);try{localStorage.setItem(KEY+".theme",v);}catch(x){}settings();return;}
  if(a==="demo"){demo();return;}
  if(a==="backup"){backup();return;}
  if(a==="restore"){restore();return;}
  if(a==="doimport"){const t=document.getElementById("impText");if(t&&t.value.trim())doImport(t.value.trim());else toast("Velg en fil eller lim inn teksten først");return;}
  if(a==="welcome"){welcome(0);return;}
  if(a==="wnext"){welcome(+v);return;}
  if(a==="howto"){howto();return;}
  if(a==="startapp"){try{localStorage.setItem(KEY+".welcomed","1");}catch(x){}closeModal();return;}
  if(a==="askwipe"){askWipe();return;}
  if(a==="wipe"){S=blank();save(true);closeModal();render();toast("Alt er slettet");return;}
});
document.getElementById("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal();});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal();
  if(e.key==="Enter"&&e.target.id==="hobIn")document.querySelector('[data-act="hobadd"]').click();
  if(e.key==="Enter"&&["mName","mDetail","mSince"].includes(e.target.id))document.querySelector('[data-act="madd"]').click();
  if(e.key==="Enter"&&e.target.id==="qIn")document.querySelector('[data-act="qadd"]').click();});
function bind(e){const el=e.target;if(!el.dataset||!el.dataset.bind)return;const[col,key,f]=el.dataset.bind.split("|");
  if(col==="root")S[f]=el.value;else if(col==="doctor")S.doctor[f]=el.value;else{S[col][key]=S[col][key]||{};S[col][key][f]=el.value;if(col==="days"&&f==="next")delete S[col][key].nextCarry;}saveSoon();}
document.addEventListener("change",e=>{if(e.target.id==="impFile"&&e.target.files&&e.target.files[0]){const r=new FileReader();r.onload=()=>doImport(String(r.result));r.readAsText(e.target.files[0]);}});
document.addEventListener("input",bind);document.addEventListener("change",bind);
try{const t=localStorage.getItem(KEY+".theme");if(t&&t!=="auto")document.documentElement.setAttribute("data-theme",t);}catch(e){}
/* oppdateringssjekk: ser etter nyere versjon der appen ligger, uten å røre dataene */
const MY_VER=(document.querySelector('meta[name="app-version"]')||{}).content||"";
let updShown=false;
function checkUpdate(){
  if(updShown||!/^https?:/.test(location.protocol)||!window.fetch)return;
  fetch(location.pathname+"?sjekk="+Date.now(),{cache:"no-store"}).then(r=>r.ok?r.text():"").then(t=>{
    const m=t.match(/<meta name="app-version" content="([^"]+)"/);
    if(m&&m[1]&&m[1]!==MY_VER){updShown=true;const el=document.getElementById("upd");el.dataset.v=m[1];el.classList.add("show");}
  }).catch(()=>{});
}
document.getElementById("upd").addEventListener("click",e=>{
  if(!e.target.closest("button"))return;
  save(true);
  location.replace(location.pathname+"?v="+encodeURIComponent(document.getElementById("upd").dataset.v||Date.now()));
});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")checkUpdate();});
setTimeout(checkUpdate,1500);
render();
try{if(!localStorage.getItem(KEY+".welcomed"))welcome(0);}catch(e){welcome(0);}
})();
</script>
