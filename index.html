<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Midt i livet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --desk:#E9E3DA; --paper:#FBF8F3; --ink:#4A3F3A; --muted:#857970; --rule:#D9CEC2; --border:#A89A8E;
  --blush:#F3DDD6; --blush-d:#B5776C;
  --beige:#EFE2D0; --beige-d:#A5825B;
  --taupe:#E2DAD1; --taupe-d:#7B6C60;
  --sage:#CDD6C3; --sage-d:#5C7354;
  --mauve:#E6D4CF; --mauve-d:#976C70;
  --peach:#F6E6D5; --peach-d:#B98356;
  --forest:#3F5A47; --on-forest:#F4EFE6;
  --olive:#DFE0CD; --olive-d:#6B6E45; --clay:#EEDDCC; --clay-d:#99694A;
  --serif:"Cormorant Garamond", Georgia, "Times New Roman", serif;
  --sans:"Source Sans 3", "Segoe UI", Helvetica, Arial, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --desk:#1C1917; --paper:#26211E; --ink:#EDE4DA; --muted:#AFA398; --rule:#443B35; --border:#6B5E55;
    --blush:#3A2A28; --blush-d:#E0A597; --beige:#372E24; --beige-d:#D6B28A; --taupe:#312B27; --taupe-d:#BFAFA2;
    --sage:#29302A; --sage-d:#A6BD9C; --mauve:#352A2B; --mauve-d:#D2A5A9; --peach:#3A2F25; --peach-d:#E0AE82;
    --forest:#2F4637; --on-forest:#EDE4DA; --olive:#2E3024; --olive-d:#BFC296; --clay:#382B22; --clay-d:#DDAA88;
  }
}
:root[data-theme="dark"]{
  --desk:#1C1917; --paper:#26211E; --ink:#EDE4DA; --muted:#AFA398; --rule:#443B35; --border:#6B5E55;
  --blush:#3A2A28; --blush-d:#E0A597; --beige:#372E24; --beige-d:#D6B28A; --taupe:#312B27; --taupe-d:#BFAFA2;
  --sage:#29302A; --sage-d:#A6BD9C; --mauve:#352A2B; --mauve-d:#D2A5A9; --peach:#3A2F25; --peach-d:#E0AE82;
  --forest:#2F4637; --on-forest:#EDE4DA; --olive:#2E3024; --olive-d:#BFC296; --clay:#382B22; --clay-d:#DDAA88;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;background:var(--desk);color:var(--ink);font-family:var(--sans);font-size:18px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100%}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--beige-d);outline-offset:3px;border-radius:6px}
.wrap{max-width:600px;margin:0 auto;padding:14px 12px 110px}
.page{background:var(--paper);border-radius:22px;padding:18px 18px 28px;box-shadow:0 1px 2px rgba(60,45,35,.08),0 10px 30px rgba(60,45,35,.07)}
header.top{display:flex;align-items:center;justify-content:space-between}
.brand{font-family:var(--serif);font-style:italic;font-weight:600;font-size:22px;color:var(--ink);line-height:1.1}
.logo{width:62px;height:48px;flex:none;color:var(--ink);--lw:.5}
.welcome-logo{width:200px;height:154px;display:block;margin:4px auto 12px;color:var(--ink);--lw:0}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--beige);border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin-top:14px;font-size:16px}
.banner .btn{min-height:42px;padding:6px 16px;font-size:15px;flex:none}
.steps{display:flex;justify-content:center;gap:8px;margin:14px 0 4px}
.steps i{width:9px;height:9px;border-radius:50%;border:1.3px solid var(--ink)}
.steps i.on{background:var(--ink)}
.modal textarea.plain{width:100%;min-height:120px;border:1px solid var(--border);border-radius:12px;background:var(--paper);padding:10px;font-size:13px;font-family:ui-monospace,Menlo,monospace}
.set-h{font-family:var(--serif);font-size:21px;font-weight:600;margin:20px 0 4px;text-align:center}
.modal .card{max-height:88vh;overflow-y:auto}
.howto{margin:8px 0 0;padding-left:22px;text-align:left}
.howto li{margin:6px 0}
.tagline{font-size:14px;color:var(--muted);margin-top:2px}
.icon-btn{width:46px;height:46px;border-radius:50%;border:1px solid var(--rule);background:var(--paper);display:grid;place-items:center;color:var(--ink)}
.icon-btn svg{width:21px;height:21px}
.title{text-align:center;margin:10px 0 2px}
.title .orn{display:flex;align-items:center;justify-content:center;gap:14px;font-family:var(--serif);font-size:19px;letter-spacing:.28em;text-transform:uppercase;color:var(--ink)}
.title .orn::before,.title .orn::after{content:"";width:34px;height:14px;background:
  radial-gradient(circle at 50% 50%,var(--ink) 1.6px,transparent 2px),
  linear-gradient(var(--ink),var(--ink)) center/100% 1px no-repeat;opacity:.75}
.title h1{font-family:var(--serif);font-weight:600;font-size:44px;line-height:1;letter-spacing:.06em;text-transform:uppercase;margin:4px 0 0}
.title .sub{font-family:var(--serif);font-style:italic;font-size:19px;color:var(--muted);margin:6px 0 0}
.nav{display:flex;align-items:center;justify-content:center;gap:12px;margin:12px 0 4px}
.nav .icon-btn{width:42px;height:42px}
.nav .lbl{font-family:var(--serif);font-size:19px;min-width:0}
.link{background:none;border:none;color:var(--beige-d);font-weight:600;padding:6px 2px;text-decoration:underline;text-underline-offset:4px;font-size:16px}
.grid{display:grid;gap:14px;margin-top:18px}
@media (min-width:430px){.grid.two{grid-template-columns:1fr 1fr}.span{grid-column:1/-1}}
.box{border:1px solid var(--border);border-radius:14px;background:var(--c,var(--taupe));overflow:hidden}
.box > .hd{display:flex;align-items:center;justify-content:center;gap:10px;padding:9px 12px 7px;border-bottom:1px solid var(--border);font-family:var(--serif);font-size:20px;font-weight:600;letter-spacing:.04em}
.box > .hd::before,.box > .hd::after{content:"✦";font-size:11px;opacity:.7}
.box.dark{--c:var(--forest);color:var(--on-forest)}
.box.dark > .hd{border-color:rgba(255,255,255,.25)}
.box > .bd{padding:14px 14px 16px}
.c-blush{--c:var(--blush);--d:var(--blush-d)} .c-beige{--c:var(--beige);--d:var(--beige-d)} .c-taupe{--c:var(--taupe);--d:var(--taupe-d)}
.c-sage{--c:var(--sage);--d:var(--sage-d)} .c-mauve{--c:var(--mauve);--d:var(--mauve-d)} .c-peach{--c:var(--peach);--d:var(--peach-d)}
.c-olive{--c:var(--olive);--d:var(--olive-d)} .c-clay{--c:var(--clay);--d:var(--clay-d)}
.c-paper{--c:var(--paper);--d:var(--taupe-d)}
.q{font-size:17px;margin:0 0 10px;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.q + .q, .bd .sp{margin-top:18px}
.q .val{font-family:var(--serif);font-style:italic;font-size:19px;color:var(--d)}
.dots{display:flex;gap:10px}
.dot{width:46px;height:46px;border-radius:50%;border:1.5px solid var(--d);background:var(--paper);transition:background .15s}
.dot.fill{background:var(--d)}
.ends{display:flex;justify-content:space-between;width:270px;max-width:100%;font-size:14px;color:var(--muted);margin-top:4px}
.radios{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px}
.opt{display:flex;align-items:center;gap:10px;background:none;border:none;padding:8px 2px;text-align:left;font-size:17px;min-height:44px}
.opt .r{flex:none;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--d);background:var(--paper);display:grid;place-items:center}
.opt.on .r::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--d)}
.radios.cols > div{display:flex;flex-direction:column}
.colh{font-family:var(--serif);font-style:italic;font-size:18px;color:var(--d);margin:0 0 2px;padding-bottom:4px;border-bottom:1px solid var(--border)}
.opt .s{flex:none;width:24px;height:24px;border-radius:5px;border:1.5px solid var(--d);background:var(--paper);display:grid;place-items:center}
.opt.on .s{background:var(--d)}
.opt.on .s::after{content:"";width:10px;height:6px;border-left:2.5px solid var(--paper);border-bottom:2.5px solid var(--paper);transform:rotate(-45deg) translate(1px,-1px)}
.lined{display:block;width:100%;border:none;background:transparent;resize:vertical;padding:0 4px;font-size:18px;line-height:34px;min-height:136px;
  background-image:repeating-linear-gradient(to bottom,transparent 0 33px,var(--border) 33px 34px);background-attachment:local;opacity:1}
.lined:focus{outline:none;background-color:rgba(255,255,255,.35)}
.box.dark .lined{background-image:repeating-linear-gradient(to bottom,transparent 0 33px,rgba(255,255,255,.28) 33px 34px);color:var(--on-forest)}
.lined.short{min-height:102px}
input[type=text],input[type=date]{width:100%;border:none;border-bottom:1px solid var(--border);background:transparent;padding:8px 4px;font-size:18px}
input:focus{outline:none;border-bottom-color:var(--ink)}
.hint{font-size:15px;color:var(--muted);margin:8px 0 0}
.foot{text-align:center;font-family:var(--serif);font-style:italic;font-size:18px;color:var(--muted);margin:22px 8px 0}
/* tracker */
.tracker{display:grid;grid-template-columns:minmax(92px,1.3fr) repeat(7,1fr);gap:7px 4px;align-items:center}
.tracker .h{text-align:center;font-size:13px;color:var(--muted);font-weight:600}
.tracker .rl{font-size:15px}
.tracker .cell{justify-self:center;width:28px;height:28px;border-radius:50%;border:1.3px solid var(--d);background:var(--paper);padding:0}
.tracker .cell.f{background:color-mix(in srgb,var(--d) var(--a),var(--paper))}
.facts{list-style:none;padding:0;margin:0}
.facts li{display:flex;justify-content:space-between;gap:12px;padding:8px 2px;border-bottom:1px solid var(--border)}
.facts li:last-child{border-bottom:none}
.facts li span:last-child{font-weight:600;text-align:right}
.seg{display:flex;justify-content:center;gap:6px;margin-top:14px;flex-wrap:wrap}
.seg button{border:1px solid var(--border);background:var(--paper);border-radius:999px;padding:7px 16px;min-height:42px;font-size:16px}
.seg button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chart{width:100%;height:auto;display:block}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:15px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px;margin-right:6px}
.heat{display:grid;gap:5px 3px;align-items:center}
.heat .c{justify-self:center;width:min(22px,100%);aspect-ratio:1;border-radius:50%;border:1.2px solid var(--d)}
.heat .lb{font-size:13px;color:var(--muted)}
.bars{list-style:none;padding:0;margin:0}
.bars li{margin:0 0 12px}.bars li:last-child{margin:0}
.bar{height:10px;border-radius:5px;background:var(--paper);border:1px solid var(--border);margin-top:5px;overflow:hidden}
.bar b{display:block;height:100%;background:var(--d)}
.insight{margin:0 0 12px;font-size:17px}.insight:last-child{margin:0}
.insight::before{content:"✦ ";color:var(--d)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:10px 22px;border-radius:999px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);font-weight:600;font-size:17px}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.danger{background:#8B3A2E;border-color:#8B3A2E;color:#fff}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;justify-content:center}
.list{list-style:none;padding:0;margin:0}
.list li{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border);min-height:46px}
.list li .t{flex:1;padding:6px 0}
.list li.done .t{text-decoration:line-through;color:var(--muted)}
.x{background:none;border:none;color:var(--muted);font-size:24px;width:40px;height:40px;line-height:1}
.addrow{display:flex;gap:8px;margin-top:10px;align-items:flex-end}
.addrow input{flex:1}
.addrow .btn{min-height:42px;padding:6px 18px;font-size:16px}
.from-weeks{list-style:none;padding:0;margin:0}
.from-weeks li{padding:8px 0;border-bottom:1px solid rgba(255,255,255,.25);font-size:17px}
.from-weeks li:last-child{border-bottom:none}
.from-weeks small{display:block;opacity:.75;font-size:14px}
.empty{text-align:center}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
nav.tabs .in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{border:none;background:none;padding:9px 2px 11px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13.5px;color:var(--muted);min-height:62px}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:var(--ink);font-weight:600}
nav.tabs button.on svg{stroke:var(--blush-d)}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);background:var(--ink);color:var(--paper);padding:9px 18px;border-radius:999px;font-size:15px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:20}
.toast.show{opacity:1;transform:translate(-50%,0)}
.modal{position:fixed;inset:0;background:rgba(40,30,25,.4);display:none;align-items:flex-end;justify-content:center;z-index:30;padding:0 12px calc(12px + env(safe-area-inset-bottom,0px))}
.modal.open{display:flex}
.modal .card{background:var(--paper);border-radius:22px;padding:24px 20px;max-width:540px;width:100%}
.modal h3{font-family:var(--serif);font-size:28px;font-weight:600;margin:0 0 6px;text-align:center}
.modal p{text-align:center}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
@media print{
  body{background:#fff}
  nav.tabs,header.top,.no-print,.toast{display:none!important}
  .wrap{padding:0;max-width:none}.page{box-shadow:none}
}
</style>
</head>

<div class="toast" id="toast" role="status" aria-live="polite">Lagret</div>
<div class="modal" id="modal" role="dialog" aria-modal="true"><div class="card" id="modalCard"></div></div>

<script>
(function(){
const KEY="minovergang.v1";
const blank=()=>({meta:{},days:{},weeks:{},months:{},hobbies:[],work:"",doctor:{impact:"",since:"",questions:[],said:"",tryout:"",next:""}});
/* lagring: Claude-lagring når appen åpnes i Claude, ellers nettleserens lagring */
const LS=(()=>{try{const t="__mil";localStorage.setItem(t,t);const ok=localStorage.getItem(t)===t;localStorage.removeItem(t);return ok;}catch(e){return false;}})();
const CS=!!(window.storage&&typeof window.storage.get==="function");
let STORE_OK=LS||CS, loaded=false;
async function kget(k){
  if(CS){try{const r=await window.storage.get(k,false);if(r&&r.value!=null)return r.value;}catch(e){}}
  if(LS){try{return localStorage.getItem(k);}catch(e){}}
  return null;}
async function kset(k,v){let ok=false;
  if(CS){try{const r=await window.storage.set(k,v,false);if(r)ok=true;}catch(e){}}
  if(LS){try{localStorage.setItem(k,v);ok=true;}catch(e){}}
  return ok;}
function normalize(){S=Object.assign(blank(),S||{});S.meta=S.meta||{};S.doctor=Object.assign(blank().doctor,S.doctor||{});}
let S=blank();
let saveT,toastT;
function save(quiet){if(!loaded)return;
  kset(KEY,JSON.stringify(S)).then(ok=>{
    if(ok){if(!quiet)toast("Lagret");}
    else{toast("Kunne ikke lagre");if(STORE_OK){STORE_OK=false;render();}}
  });}
function saveSoon(){clearTimeout(saveT);saveT=setTimeout(()=>save(),600);}
function toast(t){const el=document.getElementById("toast");el.textContent=t;el.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove("show"),1300);}

const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse=s=>{const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c);};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
const monday=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x;};
function weekNo(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const n=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-n);const y=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y)/864e5+1)/7);}
const today=()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate());};
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const fmtLong=d=>cap(d.toLocaleDateString("nb-NO",{weekday:"long",day:"numeric",month:"long"}));
const fmtShort=d=>d.toLocaleDateString("nb-NO",{day:"numeric",month:"short"}).replace(".","");
const monthKey=d=>d.getFullYear()+"-"+pad(d.getMonth()+1);
const fmtMonth=d=>cap(d.toLocaleDateString("nb-NO",{month:"long",year:"numeric"}));
const num=(n,d=1)=>n==null||isNaN(n)?"–":n.toFixed(d).replace(".",",");
const esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const DN=["M","T","O","T","F","L","S"], DN2=["Ma","Ti","On","To","Fr","Lø","Sø"];

const SCALES={
  sleep:{q:"Hvordan sov du i natt?",l:["Svært dårlig","Dårlig","Greit","Godt","Svært godt"]},
  mood:{q:"Hvordan er humøret?",l:["Tungt","Lavt","Nøytralt","Godt","Lyst"]},
  energy:{q:"Hvor mye energi har du hatt?",l:["Helt tom","Lite","Middels","God","Full"]},
  work:{q:"Energien på jobb",l:["Helt tom","Lite","Middels","God","Full"]}
};
const FLASH=["Ingen","1–2","3–5","6 eller flere"], FLASHN=[0,1.5,4,7];
const BLEED=["Ingen","Småblødning","Vanlig","Kraftig"];
const HOURS=["Under 5 timer","5–6 timer","6–7 timer","7–8 timer","Over 8 timer"], HOURSN=[4.5,5.5,6.5,7.5,8.5];
const WAKE=["Ingen","1–2 ganger","3 eller flere"];
const MOVEMIN=["Ingen","Under 30 min","30–60 min","Over 60 min"];
const MOVE_A=["Gå tur","Jogging","Sykkel","Hage eller husarbeid","Annet"], MOVE_B=["Styrke med vekter","Pilates og egenvekt","Yoga eller tøying","Svømming","Dans"];
const FOOD_A=["Faste måltider","Drakk nok vann","Grønnsaker eller frukt","Kaffe etter kl. 14","Snacks"], FOOD_B=["Spiste ute","Takeaway","Alkohol","Sterk mat","Mye sukker"];
const SYMPT_A=["Nattesvette","Hjertebank","Hodepine","Ledd og muskler","Tørr hud"], SYMPT_B=["Svimmelhet","Hjernetåke","Uro","Nedstemthet","Irritabilitet"];

const U={view:"today",day:today(),week:monday(today()),month:new Date(today().getFullYear(),today().getMonth(),1),range:8,heat:"sleep"};

const ICONS={
 today:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>',
 week:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="5" cy="8" r="1.8"/><circle cx="12" cy="8" r="1.8"/><circle cx="19" cy="8" r="1.8"/><circle cx="5" cy="16" r="1.8"/><circle cx="12" cy="16" r="1.8"/><circle cx="19" cy="16" r="1.8"/></svg>',
 life:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M12 21c-5-3.5-8-6.5-8-10a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 11c0 3.5-3 6.5-8 10z"/></svg>',
 overview:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 19h16"/><path d="M4 15l5-5 4 3 7-7"/></svg>',
 doctor:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="5" y="3.5" width="14" height="17" rx="2.5"/><path d="M9 3.5h6v3H9zM9 11h6M9 15h4"/></svg>'
};
const TABS=[["today","I dag"],["week","Uka"],["life","Livet"],["overview","Oversikt"],["doctor","Legetimen"]];
const chev=dir=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="${dir<0?"M15 5l-7 7 7 7":"M9 5l7 7-7 7"}"/></svg>`;
const box=(c,t,inner,cls="")=>`<section class="box c-${c} ${cls}">${t?`<div class="hd">${t}</div>`:""}<div class="bd">${inner}</div></section>`;
const title=(small,big,sub)=>`<div class="title">${small?`<div class="orn">${small}</div>`:""}<h1>${big}</h1>${sub?`<p class="sub">${sub}</p>`:""}</div>`;

function renderTabs(){document.getElementById("tabs").innerHTML=TABS.map(([k,l])=>`<button data-act="tab" data-v="${k}" class="${U.view===k?"on":""}" ${U.view===k?'aria-current="page"':""}>${ICONS[k]}<span>${l}</span></button>`).join("");}
function render(){renderTabs();document.getElementById("view").innerHTML=({today:vToday,week:vWeek,life:vLife,overview:vOverview,doctor:vDoctor})[U.view]();if(U.view==="overview")drawAfter();}

/* I DAG */
function dayData(k){return S.days[k]||(S.days[k]={});}
function scale(f,val){const s=SCALES[f];
  return `<p class="q"><span>${s.q}</span><span class="val">${val?s.l[val-1]:""}</span></p>
  <div class="dots" role="group" aria-label="${s.q}">${[1,2,3,4,5].map(i=>`<button class="dot ${val&&i<=val?"fill":""}" data-act="rate" data-f="${f}" data-v="${i}" aria-pressed="${val===i}" aria-label="${s.l[i-1]}"></button>`).join("")}</div>
  <div class="ends"><span>${s.l[0]}</span><span>${s.l[4]}</span></div>`;}
const checks=(f,labels,arr)=>`<div class="radios">${labels.map(s=>{const on=(arr||[]).includes(s);return `<button class="opt ${on?"on":""}" data-act="multi" data-f="${f}" data-v="${s}" aria-pressed="${on}"><span class="s"></span>${s}</button>`;}).join("")}</div>`;
const optBtn=(f,s,arr)=>{const on=(arr||[]).includes(s);return `<button class="opt ${on?"on":""}" data-act="multi" data-f="${f}" data-v="${s}" aria-pressed="${on}"><span class="s"></span>${s}</button>`;};
const checkCols=(f,cols,arr)=>`<div class="radios cols">${cols.map(([h,l])=>`<div>${h?`<p class="colh">${h}</p>`:""}${l.map(s=>optBtn(f,s,arr)).join("")}</div>`).join("")}</div>`;
const radios=(f,labels,val)=>`<div class="radios">${labels.map((l,i)=>`<button class="opt ${val===i?"on":""}" data-act="pick" data-f="${f}" data-v="${i}" aria-pressed="${val===i}"><span class="r"></span>${l}</button>`).join("")}</div>`;
function vToday(){
  const k=iso(U.day), d=S.days[k]||{}, isToday=k===iso(today());
  let last7=0;for(let i=0;i<7;i++){const x=S.days[iso(addDays(today(),-i))];if(x&&Object.keys(x).length)last7++;}
  const work=d.noWork?"":scale("work",d.work);
  const nDays=Object.keys(S.days).filter(k=>Object.keys(S.days[k]).length).length;
  const lb=S.meta.lastBackup?parse(S.meta.lastBackup):null;
  const needBackup=nDays>=7&&(!lb||(today()-lb)/864e5>30);
  return `${title("Daglig logg",isToday?"I dag":"Tilbake",fmtLong(U.day))}
  ${!STORE_OK?`<div class="banner no-print" style="background:var(--blush)"><span>Denne visningen kan ikke lagre. Det du fyller ut, forsvinner når du lukker appen. Åpne den i Safari eller Chrome fra en nettadresse i stedet.</span></div>`:""}
  ${STORE_OK&&needBackup?`<div class="banner no-print"><span>${lb?"Det er over en måned siden forrige sikkerhetskopi.":"Du har ikke tatt sikkerhetskopi ennå."}</span><button class="btn" data-act="backup">Ta kopi nå</button></div>`:""}
  <div class="nav no-print">
    <button class="icon-btn" data-act="day" data-v="-1" aria-label="Forrige dag">${chev(-1)}</button>
    ${!isToday?`<button class="link" data-act="gotoday">Til i dag</button>`:`<span class="lbl" style="color:var(--muted);font-size:16px">Under ett minutt</span>`}
    <button class="icon-btn" data-act="day" data-v="1" aria-label="Neste dag" ${isToday?'disabled style="opacity:.3"':""}>${chev(1)}</button>
  </div>
  <div class="grid">
    ${box("blush","Søvn",scale("sleep",d.sleep)+`<p class="q" style="margin-top:18px"><span>Hvor mange timer sov du?</span></p>${radios("sleepH",HOURS,d.sleepH)}<p class="q" style="margin-top:16px"><span>Hvor mange ganger våknet du?</span></p>${radios("wake",WAKE,d.wake)}`)}
    ${box("beige","Sinn",scale("mood",d.mood))}
    ${box("sage","Energi",scale("energy",d.energy)+`<div class="sp"></div>`+work+`<button class="opt ${d.noWork?"on":""}" data-act="nowork" style="margin-top:8px"><span class="s"></span>Jobbet ikke i dag</button>`)}
    ${box("olive","Bevegelse",`<p class="q"><span>Hvor mye beveget du deg?</span></p>${radios("move",MOVEMIN,d.move)}<p class="q" style="margin-top:16px"><span>Hva gjorde du?</span></p>${checkCols("moveType",[["I hverdagen",MOVE_A],["Trening og timer",MOVE_B]],d.moveType)}`)}
    ${box("clay","Mat og drikke",`<p class="q"><span>Kryss av det som stemmer i dag</span></p>${checkCols("food",[["I hverdagen",FOOD_A],["Ute og kos",FOOD_B]],d.food)}<p class="hint">Ingen kalorier eller vekt. Bare det som kan henge sammen med søvn og energi.</p>`)}
    ${box("peach","Hetetokter",radios("flash",FLASH,d.flash))}
    ${box("taupe","Kroppen i dag",checkCols("sym",[["",SYMPT_A],["",SYMPT_B]],d.sym))}
    ${box("mauve","Syklus",radios("bleed",BLEED,d.bleed))}
    ${box("paper","Notater",`<textarea class="lined short" data-bind="days|${k}|note" aria-label="Notater" placeholder="Et par stikkord holder">${esc(d.note)}</textarea>`)}
  </div>
  <p class="foot">${last7} av de siste 7 dagene er fylt ut. Alt lagres automatisk, bare på denne enheten.</p>`;
}

/* UKA */
function daysIn(start,n){const a=[];for(let i=0;i<n;i++){const dt=addDays(start,i);a.push({dt,k:iso(dt),d:S.days[iso(dt)]});}return a;}
function avg(arr,f){const v=arr.map(x=>x.d&&x.d[f]).filter(x=>typeof x==="number"&&x>0);return v.length?v.reduce((a,b)=>a+b,0)/v.length:null;}
function vWeek(){
  const ws=U.week, wk=iso(ws), w=S.weeks[wk]||{}, days=daysIn(ws,7), isCur=wk===iso(monday(today()));
  const row=(label,f,max,c)=>`<span class="rl c-${c}">${label}</span>`+days.map(x=>{const v=x.d&&x.d[f];const has=typeof v==="number"&&v>0;
     return `<button class="cell c-${c} ${has?"f":""}" style="--a:${has?Math.round(25+75*v/max):0}%" data-act="goday" data-v="${x.k}" aria-label="${label} ${fmtShort(x.dt)}${has?": "+v:""}"></button>`;}).join("");
  const tr=`<div class="tracker"><span></span>${DN.map(n=>`<span class="h">${n}</span>`).join("")}
    ${row("Søvn","sleep",5,"blush")}${row("Oppvåkninger","wake",2,"blush")}${row("Humør","mood",5,"beige")}${row("Energi","energy",5,"sage")}${row("På jobb","work",5,"sage")}${row("Bevegelse","move",3,"olive")}${row("Hetetokter","flash",3,"peach")}${row("Blødning","bleed",3,"mauve")}</div>
    <p class="hint">Mørkere sirkel betyr mer. Trykk på en sirkel for å åpne dagen.</p>`;
  const ta=(f,ph)=>`<textarea class="lined short" data-bind="weeks|${wk}|${f}" placeholder="${ph||""}">${esc(w[f])}</textarea>`;
  return `${title("Ukesoversikt","Uke "+weekNo(ws),fmtShort(ws)+" til "+fmtShort(addDays(ws,6)))}
  <div class="nav no-print">
    <button class="icon-btn" data-act="week" data-v="-1" aria-label="Forrige uke">${chev(-1)}</button>
    ${!isCur?`<button class="link" data-act="thisweek">Denne uka</button>`:`<span class="lbl" style="color:var(--muted);font-size:16px">Denne uka</span>`}
    <button class="icon-btn" data-act="week" data-v="1" aria-label="Neste uke" ${isCur?'disabled style="opacity:.3"':""}>${chev(1)}</button>
  </div>
  <div class="grid two">
    ${box("paper","Ukas tracker",tr,"span")}
    ${box("blush","Tyngst denne uka",ta("hard"))}
    ${box("sage","Det som hjalp",ta("better"))}
    ${box("beige","Kroppen og jobben",ta("workimpact","Hvordan påvirket kroppen arbeidsdagene?"))}
    ${box("taupe","Gjør jobben lettere",ta("workease"))}
    ${box("mauve","Små gode ting",ta("joy"))}
    ${box("peach","Neste uke vil jeg prøve",ta("next"))}
  </div>`;
}

/* LIVET */
function vLife(){
  const mk=monthKey(U.month), m=S.months[mk]||{}, isCur=mk===monthKey(today());
  const ta=(f,ph,cls)=>`<textarea class="lined ${cls||""}" data-bind="months|${mk}|${f}" placeholder="${ph||""}">${esc(m[f])}</textarea>`;
  const eases=Object.keys(S.weeks).sort().reverse().filter(k=>S.weeks[k].workease&&S.weeks[k].workease.trim()).slice(0,5)
     .map(k=>`<li>${esc(S.weeks[k].workease)}<small>Uke ${weekNo(parse(k))}</small></li>`).join("");
  const hob=S.hobbies.map((h,i)=>`<li class="${h.done?"done":""}"><button class="opt ${h.done?"on":""}" style="padding:0" data-act="hobdone" data-v="${i}" aria-label="Merk som gjort"><span class="s"></span></button><span class="t">${esc(h.t)}</span><button class="x" data-act="hobdel" data-v="${i}" aria-label="Fjern">×</button></li>`).join("");
  return `${title("Månedlig","Livet videre",fmtMonth(U.month))}
  <div class="nav no-print">
    <button class="icon-btn" data-act="month" data-v="-1" aria-label="Forrige måned">${chev(-1)}</button>
    ${!isCur?`<button class="link" data-act="thismonth">Denne måneden</button>`:`<span class="lbl" style="color:var(--muted);font-size:16px">Én gang i måneden</span>`}
    <button class="icon-btn" data-act="month" data-v="1" aria-label="Neste måned" ${isCur?'disabled style="opacity:.3"':""}>${chev(1)}</button>
  </div>
  <div class="grid two">
    ${box("sage","Mer av",ta("more","","short"))}
    ${box("mauve","Mindre av",ta("less","","short"))}
    ${box("beige","Drømmeuka om to år",ta("dream","Hvor mange dager jobber du? Hva gjør du med fritiden?"),"span")}
    ${box("paper","Ting jeg vil gjøre",`<ul class="list">${hob}</ul><div class="addrow no-print"><input type="text" id="hobIn" placeholder="For eksempel morgenbad" aria-label="Ny ting"><button class="btn" data-act="hobadd">Legg til</button></div>`,"span")}
    ${box("","Det jeg trenger på jobb",`<textarea class="lined short" data-bind="root||work" placeholder="Rolige morgener, færre sene møter …">${esc(S.work)}</textarea>${eases?`<p class="hint" style="color:inherit;opacity:.8;margin-top:14px">Fra ukene dine:</p><ul class="from-weeks">${eases}</ul>`:""}`,"dark span")}
  </div>`;
}

/* OVERSIKT */
function weeksBack(n){const a=[];let m=monday(today());for(let i=n-1;i>=0;i--)a.push(addDays(m,-7*i));return a;}
function vOverview(){
  const all=daysIn(addDays(today(),-(U.range*7-1)),U.range*7);
  const regs=all.filter(x=>x.d&&Object.keys(x.d).length);
  const seg=`<div class="seg no-print" role="group" aria-label="Periode">${[4,8,12].map(n=>`<button class="${U.range===n?"on":""}" data-act="range" data-v="${n}">${n} uker</button>`).join("")}</div>`;
  if(regs.length<3){
    return `${title("Mønstre","Oversikt","Grafene kommer når du har fylt ut noen dager")}
    <div class="grid">${box("beige","Vil du se et eksempel?",`<div class="empty"><p style="margin-top:0">Fyll ut <b>I dag</b> et par kvelder, eller se hvordan det ser ut med tre måneders registreringer.</p><div class="row"><button class="btn" data-act="demo">Vis med eksempeldata</button></div><p class="hint">Eksempeldataene kan slettes under innstillinger.</p></div>`)}</div>`;
  }
  const sc={};regs.forEach(x=>(x.d.sym||[]).forEach(s=>sc[s]=(sc[s]||0)+1));
  const tops=Object.entries(sc).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const bars=tops.map(([s,c])=>{const p=Math.round(c/regs.length*100);return `<li><div style="display:flex;justify-content:space-between"><span>${s}</span><span style="color:var(--muted)">${p} %</span></div><div class="bar"><b style="width:${p}%"></b></div></li>`;}).join("");
  const ins=insights(all);
  return `${title("Mønstre","Oversikt",regs.length+" dager fylt ut")}
  ${seg}
  <div class="grid">
    ${box("paper","Uke for uke",`<svg class="chart" id="lineChart" viewBox="0 0 340 180" role="img" aria-label="Søvn, humør og energi per uke"></svg><div class="legend"><span><i style="background:var(--blush-d)"></i>Søvn</span><span><i style="background:var(--beige-d)"></i>Humør</span><span><i style="background:var(--sage-d)"></i>Energi</span></div><p class="hint">Snitt per uke, fra 1 til 5.</p>`)}
    ${box("peach","Hetetokter",`<svg class="chart" id="barChart" viewBox="0 0 340 140" role="img" aria-label="Hetetokter per uke"></svg><p class="hint">Omtrent hvor mange per dag, snitt per uke.</p>`)}
    ${box(U.heat==="sleep"?"blush":U.heat==="mood"?"beige":"sage","Fargekart",`<div class="seg no-print" style="margin:0 0 12px">${[["sleep","Søvn"],["mood","Humør"],["energy","Energi"]].map(([k,l])=>`<button class="${U.heat===k?"on":""}" data-act="heat" data-v="${k}">${l}</button>`).join("")}</div><div id="heat"></div><p class="hint">Hver kolonne er en uke. Mørkere betyr bedre.</p>`)}
    ${ins?box("","Det dataene dine viser",ins,"dark"):""}
    ${bars?box("taupe","Det du kjenner oftest",`<ul class="bars">${bars}</ul>`):""}
  </div>`;
}
function insights(all){
  const out=[];const pair=(A,B,f)=>A.length>=3&&B.length>=3?[avg(A,f),avg(B,f)]:null;
  let p=pair(all.filter(x=>x.d&&x.d.flash>=2&&x.d.sleep),all.filter(x=>x.d&&typeof x.d.flash==="number"&&x.d.flash<2&&x.d.sleep),"sleep");
  if(p&&Math.abs(p[0]-p[1])>=.4)out.push(`På dager med tre eller flere hetetokter var søvnen i snitt <b>${num(p[0])}</b>. Andre dager <b>${num(p[1])}</b>.`);
  p=pair(all.filter(x=>x.d&&x.d.sleep>=4&&x.d.work),all.filter(x=>x.d&&x.d.sleep&&x.d.sleep<=2&&x.d.work),"work");
  if(p&&Math.abs(p[0]-p[1])>=.4)out.push(`Etter gode netter var energien på jobb <b>${num(p[0])}</b>. Etter dårlige netter <b>${num(p[1])}</b>.`);
  p=pair(all.filter(x=>x.d&&x.d.sleep>=4&&x.d.mood),all.filter(x=>x.d&&x.d.sleep&&x.d.sleep<=2&&x.d.mood),"mood");
  if(p&&Math.abs(p[0]-p[1])>=.4)out.push(`Humøret fulgte søvnen: <b>${num(p[0])}</b> etter gode netter, <b>${num(p[1])}</b> etter dårlige.`);
  {const A=all.filter(x=>x.d&&x.d.flash>=2&&typeof x.d.wake==="number"),B=all.filter(x=>x.d&&typeof x.d.flash==="number"&&x.d.flash<2&&typeof x.d.wake==="number");
   if(A.length>=3&&B.length>=3){const a=Math.round(A.filter(x=>x.d.wake===2).length/A.length*100),b=Math.round(B.filter(x=>x.d.wake===2).length/B.length*100);
   if(Math.abs(a-b)>=15)out.push(`Etter dager med tre eller flere hetetokter våknet du tre ganger eller mer <b>${a} %</b> av nettene. Ellers <b>${b} %</b>.`);}}
  const has=(x,s)=>x.d&&(x.d.food||[]).includes(s);
  const logged=all.filter(x=>x.d&&x.d.sleep&&(x.d.food||[]).length);
  p=pair(logged.filter(x=>has(x,"Alkohol")),logged.filter(x=>!has(x,"Alkohol")),"sleep");
  if(p&&Math.abs(p[0]-p[1])>=.4)out.push(`Natten etter dager med alkohol var søvnen <b>${num(p[0])}</b>. Ellers <b>${num(p[1])}</b>.`);
  p=pair(all.filter(x=>x.d&&x.d.move>=1&&x.d.energy),all.filter(x=>x.d&&x.d.move===0&&x.d.energy),"energy");

  return out.map(t=>`<p class="insight c-sage">${t}</p>`).join("");
}

  if(a==="doimport"){const t=document.getElementById("impText");if(t&&t.value.trim())doImport(t.value.trim());else toast("Velg en fil eller lim inn teksten først");return;}
  if(a==="welcome"){welcome(0);return;}
  if(a==="wnext"){welcome(+v);return;}
  if(a==="howto"){howto();return;}
  if(a==="startapp"){kset(KEY+".welcomed","1");closeModal();return;}
  if(a==="askwipe"){askWipe();return;}
  if(a==="wipe"){S=blank();save(true);closeModal();render();toast("Alt er slettet");return;}
});
document.getElementById("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal();});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal();
  if(e.key==="Enter"&&e.target.id==="hobIn")document.querySelector('[data-act="hobadd"]').click();
  if(e.key==="Enter"&&e.target.id==="qIn")document.querySelector('[data-act="qadd"]').click();});
function bind(e){const el=e.target;if(!el.dataset||!el.dataset.bind)return;const[col,key,f]=el.dataset.bind.split("|");
  if(col==="root")S[f]=el.value;else if(col==="doctor")S.doctor[f]=el.value;else{S[col][key]=S[col][key]||{};S[col][key][f]=el.value;}saveSoon();}
document.addEventListener("change",e=>{if(e.target.id==="impFile"&&e.target.files&&e.target.files[0]){const r=new FileReader();r.onload=()=>doImport(String(r.result));r.readAsText(e.target.files[0]);}});
document.addEventListener("input",bind);document.addEventListener("change",bind);
(async()=>{
  const raw=await kget(KEY);
  try{S=raw?JSON.parse(raw):blank();}catch(e){S=blank();}
  normalize();loaded=true;
  const t=await kget(KEY+".theme");if(t&&t!=="auto")document.documentElement.setAttribute("data-theme",t);
  render();
  if(!(await kget(KEY+".welcomed")))welcome(0);
})();
})();
</script>
</body>
</html>
